<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" aria-labelledby="t d">
<title id="t">SOP top-level architecture</title>
<desc id="d">The sop CLI calls the orchestrator, which drives the planner, scheduler and task runner. The task runner uses four adapters: git, validation, review and CI. Durable state in SQLite sits underneath everything.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
rect{stroke-width:.5}
.purple rect,rect.purple{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect,rect.teal{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.legend{fill:#5F5E5A;text-anchor:start}
</style>
</defs>
<rect width="680" height="570" fill="#FFFFFF" stroke="none"/>
<g class="gray"><rect x="240" y="30" width="200" height="56" rx="8"/><text class="th" x="340" y="48">sop CLI</text><text class="ts" x="340" y="66">Thin command surface</text></g>
<line x1="340" y1="86" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="40" y="126" width="600" height="80" rx="8"/><text class="th" x="340" y="156">Orchestrator</text><text class="ts" x="340" y="178">State machine, gates, retry policy</text></g>
<line x1="125" y1="206" x2="125" y2="244" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="206" x2="340" y2="244" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="206" x2="555" y2="244" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="40" y="246" width="170" height="56" rx="8"/><text class="th" x="125" y="264">Planner</text><text class="ts" x="125" y="282">PRD to task DAG</text></g>
<g class="purple"><rect x="255" y="246" width="170" height="56" rx="8"/><text class="th" x="340" y="264">Scheduler</text><text class="ts" x="340" y="282">Picks next ready task</text></g>
<g class="purple"><rect x="470" y="246" width="170" height="56" rx="8"/><text class="th" x="555" y="264">Task runner</text><text class="ts" x="555" y="282">Executes one task</text></g>
<path d="M555 302 L555 332" class="arr"/>
<path d="M107 332 L572 332" class="arr"/>
<line x1="107" y1="332" x2="107" y2="360" class="arr" marker-end="url(#arrow)"/>
<line x1="262" y1="332" x2="262" y2="360" class="arr" marker-end="url(#arrow)"/>
<line x1="417" y1="332" x2="417" y2="360" class="arr" marker-end="url(#arrow)"/>
<line x1="572" y1="332" x2="572" y2="360" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="362" width="135" height="56" rx="8"/><text class="th" x="107" y="380">Git adapter</text><text class="ts" x="107" y="398">Working branch</text></g>
<g class="teal"><rect x="195" y="362" width="135" height="56" rx="8"/><text class="th" x="262" y="380">Validation</text><text class="ts" x="262" y="398">Project commands</text></g>
<g class="teal"><rect x="350" y="362" width="135" height="56" rx="8"/><text class="th" x="417" y="380">Review</text><text class="ts" x="417" y="398">Agent review</text></g>
<g class="teal"><rect x="505" y="362" width="135" height="56" rx="8"/><text class="th" x="572" y="380">CI adapter</text><text class="ts" x="572" y="398">GitHub PR and CI</text></g>
<g class="gray"><rect x="40" y="458" width="600" height="56" rx="8"/><text class="th" x="340" y="476">Durable state</text><text class="ts" x="340" y="494">SQLite, shared by every layer</text></g>
<rect class="purple" x="40" y="534" width="12" height="12" rx="2"/><text class="ts legend" x="60" y="540">Deterministic control</text>
<rect class="teal" x="210" y="534" width="12" height="12" rx="2"/><text class="ts legend" x="230" y="540">Adapters to the outside world</text>
</svg>
