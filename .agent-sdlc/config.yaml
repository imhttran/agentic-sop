# SOP project configuration.
version: 1
project:
  name: "agentic-sop"
  integration_branch: main
agent:
  harness: tool
  provider: ollama
  model: deepseek-v4.1-flash:cloud
validation:
  build:
    - go build ./...
  test:
    - go test ./...
  lint:
    - go vet ./...
review:
  engine: self
  delegation: false
quality:
  require_tests: true
  max_fix_cycles: 3
  fail_on:
    - critical
    - high
human:
  approval_before_commit: true
  designated_approvers:
    - "Tom Tran"
autonomy:
  level: balanced
workflow:
  mode: local
# Workspace-only experimental decision memory (RDM-003). Ignored by git; the
# installation default remains disabled. Local SQLite only: no PostgreSQL,
# embeddings, or model downloads.
advisory_retrieval:
  enabled: false
  index_path: "/Users/imhttran/agentic-workspace/agentic-sop/.agent-sdlc/memory/index.db"
  outcomes_dir: "/Users/imhttran/agentic-workspace/agentic-sop/.agent-sdlc/memory/outcomes"
  allowed_corpora:
    - outcome
    - failure
  max_results: 5
  token_budget: 2000
  timeout_ms: 2000
  capture_timeout_ms: 5000

# Planner mode is opt-in; enabled locally for the PE-2 live acceptance round trip.
planner:
  enabled: true
  mode: interactive
  round_limit: 3

# Report-only Promptfoo smoke test. Workspace-local and git-ignored: the
# target, attack, and grading provider identifiers resolve to the local Ollama
# endpoint, and no credential is stored here. The reused evaluation config
# (evals/promptfoo/promptfooconfig.yaml) is the single smoke-test case; it is
# not an adversarial red-team suite.
security:
  enabled: true
  mode: report-only
  scope: workspace
  timeout_seconds: 300
  stale_advisory_database: deny
  osv_database_path: .agent-sdlc/osv-db
  # Reviewed, expiring baseline: each entry records why a reported finding is
  # not actionable. Entries stop suppressing when they expire.
  baseline: .agent-sdlc/security-baseline.json
  # Declared scope boundary: versioned test fixtures and snapshot references are
  # not shipped dependency surface. The dependency fixtures include deliberately
  # seeded vulnerable crates, so scanning them would only reproduce test data.
  exclude:
    - .git
    - .agent-sdlc
    # Machine-local linked checkouts. They are copies of this repository (often
    # other branches), not the checkout under scan; including them duplicates
    # findings and surfaces unrelated fixture manifests.
    - .worktrees
    # Machine-local historical run evidence, including copied test fixtures.
    # It is preserved for audit but is not active repository source.
    - .sop-evidence
    - .run/reference
    - internal/security/testdata
    - testdata
  adapters:
    - id: gitleaks
      category: secrets
      protocol: builtin
      command: [gitleaks]
      version: "8.30.1"
    - id: semgrep
      category: sast
      protocol: builtin
      command: [semgrep]
      rules: .agent-sdlc/security-rules
      languages: [go, rust]
      version: "1.183.0"
    - id: osv-scanner
      category: dependencies
      protocol: builtin
      command: [osv-scanner]
      languages: [go, rust]
      version: "2.7.0"
  evaluation:
    # Kept out of the routine scan path: an enabled evaluation adds ~121 s to
    # every task's quality-stage scan (SEC-LEFT-001 artifact: 121006 ms of
    # 126423 ms) while contributing no verdict (report_only, severity_mode none).
    # Enable this block temporarily for a dedicated evaluation session; see
    # docs/security-promptfoo.md. Required coverage is unaffected because
    # evaluation is not a required category.
    enabled: false
    profile: local
    target: "ollama:chat:qwen3.5:4b"
    target_provider: "ollama:chat:qwen3.5:4b"
    attack_provider: "ollama:chat:qwen3.5:4b"
    grading_provider: "ollama:chat:qwen3.5:4b"
    promptfoo_version: "0.118.0"
    config_path: "evals/promptfoo/promptfooconfig.yaml"
    data_handling: local-only
    remote_provider: false
    telemetry_disabled: true
    report_only: true
    request_limit: 5
    concurrency: 1
    process_timeout_seconds: 300
    severity_mode: none
verification:
  scoped:
    - paths: ["internal/quality/**"]
      test: ["go test ./internal/quality/..."]
    - paths: ["internal/config/**"]
      test: ["go test ./internal/config/..."]
