name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, static analysis, the full test suite, and the documentation link check.
  check:
    name: fmt, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Formatting and documentation links, through the one script the local
      # pre-push hook and `make check-push` also run. On a pull_request checkout the
      # working tree is already the merge result; when `origin/main` is not fetched
      # the script says so and checks that working tree.
      - name: formatting and documentation links
        run: bash scripts/checks/pre-push.sh --base origin/main
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # The full ordinary suite, through the fast runner. On Linux the runner keeps
      # each test's temporary SQLite database on RAM-backed /dev/shm when it fits;
      # the wrapper falls back to the system temp directory (and says why) when it
      # does not. Parallelism matches the four-core runner and the timeout matches
      # go test's default, so this is the same suite under the same limits. The
      # race-detector shards below run the same suite under -race.
      - name: test (RAM-backed TMPDIR)
        env:
          SOP_TEST_PARALLEL: "4"
          SOP_TEST_TIMEOUT: "10m"
        run: ./scripts/checks/test-fast.sh
      # End-to-end ACP stdio smoke: builds the binary and drives initialize,
      # session/new, session/prompt, and session/cancel the way an ACP client does.
      # A blocking command harness keeps the governed child alive, so the job needs
      # no model provider and no network.
      - name: ACP stdio smoke
        run: ./scripts/checks/acp-linux-smoke.sh

  # Real scanner integration: installs the PINNED Semgrep CE, Gitleaks,
  # cargo-audit, and OSV-Scanner binaries in an isolated tools directory and runs
  # the tagged checks. The script sets SOP_SECURITY_INTEGRATION_REQUIRED=1, so a
  # missing prerequisite fails the job instead of skipping it. The OSV database is
  # a controlled offline fixture; the job never depends on the live OSV API.
  security-integration:
    name: real Semgrep + Gitleaks + cargo-audit + OSV integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned scanner downloads, keyed by their committed SHA-256 pins. A cache
      # hit gets the same checksum check as a fresh download, so CI does not
      # depend on GitHub release downloads succeeding on every run.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sop-security-downloads
          key: sop-security-downloads-${{ runner.os }}-${{ hashFiles('scripts/security/*-manifest.json', 'scripts/checks/security-integration.sh') }}
      - name: pinned download cache self-check
        run: bash scripts/checks/test-fetch-pinned.sh
      - name: provision and run pinned scanners
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
          SOP_SECURITY_DOWNLOAD_CACHE: ${{ runner.temp }}/sop-security-downloads
        run: bash scripts/checks/security-integration.sh

  # Sandbox-enabled integration for the execution boundary (M1 + G3 + G4).
  #
  # The ordinary `check` job runs on an image with no bubblewrap, so every
  # sandbox-dependent test skips there. A green ordinary job is therefore not
  # evidence that the boundary works. This job gives the boundary a real backend
  # and runs the two affected suites with SOP_SANDBOX_REQUIRED=1, which turns a
  # skip into a failure.
  #
  # Ubuntu 22.04 is chosen deliberately: it permits unprivileged user namespaces,
  # so bubblewrap works without changing the host's AppArmor policy. The script
  # probes the backend first and fails loudly if it cannot start.
  sandbox-linux:
    name: sandbox-backed execution boundary (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: verify the backend can start and run the sandbox-dependent suites
        run: bash scripts/checks/sandbox-integration.sh

  # W8 Stage 2 readiness: exercise the required-mode security gate end to end with
  # temporary Stage 2 configurations and synthetic offline databases, then check
  # the database verifier against every degraded state. It reuses the pinned
  # scanners the security-integration job already provisioned, so it is a step in
  # that job rather than a second job paying for the same provisioning.
  stage2-gate-e2e:
    name: required-mode gate end to end (W8 Stage 2 readiness)
    runs-on: ubuntu-latest
    needs: security-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sop-security-tools
          key: sop-security-tools-${{ runner.os }}-${{ hashFiles('scripts/security/*-manifest.json', 'scripts/checks/security-integration.sh', 'scripts/security/semgrep-requirements.lock') }}
      - name: provision the pinned scanners this job runs
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
          SOP_SECURITY_INTEGRATION_PROVISION_ONLY: "1"
        run: bash scripts/checks/security-integration.sh
      - name: database verifier states
        run: bash scripts/checks/test-osv-db-verify.sh
      # Prove the required provisioning path end to end: fetch the real offline
      # database, then verify its layout, digests and freshness. Provisioning is an
      # explicit step here and never happens during a scan.
      - name: provision and verify the offline OSV database
        run: |
          set -euo pipefail
          SOP_SECURITY_OSV_DB_DIR="$RUNNER_TEMP/osv-db" bash scripts/security/fetch-osv-databases.sh
          bash scripts/checks/osv-db-verify.sh --db "$RUNNER_TEMP/osv-db"
      - name: required-mode gate end to end
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
        run: |
          set -euo pipefail
          tools="$SOP_SECURITY_TOOLS_DIR"
          export PATH="$tools/gitleaks-8.30.1:$tools/osv-scanner-2.7.0:$tools/semgrep-1.183.0-venv/bin:$PATH"
          export SOP_SECURITY_E2E_RULES="$tools/semgrep-rules"
          bash scripts/checks/stage2-gate-e2e.sh

  # The repository's own required security gate. The jobs above scan fixtures or a
  # temporary repository, so a new blocking finding in this repository's source
  # (for example an unbaselined exec.Command in a test) used to reach main and only
  # blocked later `sop run` tasks. This runs the real `sop security scan --required
  # --scope workspace` with the committed config and baseline
  # (scripts/checks/repo-security-gate.sh). Provisioning is explicit: the pinned
  # scanners and rules come from the same script the jobs above use, and the
  # offline OSV database is fetched here, never during the scan.
  repo-security-gate:
    name: repository required security gate
    runs-on: ubuntu-latest
    needs: security-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sop-security-tools
          key: sop-security-tools-${{ runner.os }}-${{ hashFiles('scripts/security/*-manifest.json', 'scripts/checks/security-integration.sh', 'scripts/security/semgrep-requirements.lock') }}
      - name: provision the pinned scanners and rules
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
          SOP_SECURITY_INTEGRATION_PROVISION_ONLY: "1"
        run: bash scripts/checks/security-integration.sh
      - name: provision the offline OSV database and the config's rules directory
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
        run: |
          set -euo pipefail
          bash scripts/security/fetch-osv-databases.sh
          bash scripts/checks/osv-db-verify.sh --db .agent-sdlc/osv-db
          cp -R "$SOP_SECURITY_TOOLS_DIR/semgrep-rules" .agent-sdlc/security-rules
      - name: scan the repository with the required gate
        env:
          SOP_SECURITY_TOOLS_DIR: ${{ runner.temp }}/sop-security-tools
        run: |
          set -euo pipefail
          tools="$SOP_SECURITY_TOOLS_DIR"
          export PATH="$tools/gitleaks-8.30.1:$tools/osv-scanner-2.7.0:$tools/cargo-audit-0.22.2:$tools/semgrep-1.183.0-venv/bin:$PATH"
          bash scripts/checks/repo-security-gate.sh

  # The suite under the race detector, which the lifecycle and scheduler tests rely on,
  # split across two runners (scripts/checks/race-shard.sh). Same RAM-backed TMPDIR
  # runner as the ordinary suite: SQLite I/O under -race is the slow part.
  race-shard:
    name: race detector shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: shards cover every package once
        run: bash scripts/checks/race-shard.sh --check
      - name: test -race
        # ponytail: the package suite exceeds the default 10 m per-package alarm on the
        # runner under -race. Raise the alarm; cut test cost later. Revisit when a race shard hits.
        env:
          SHARD: ${{ matrix.shard }}
          SOP_TEST_PARALLEL: "4"
          SOP_TEST_TIMEOUT: "30m"
        run: |
          SOP_TEST_PACKAGES="$(bash scripts/checks/race-shard.sh "$SHARD" | tr '\n' ' ')" \
            ./scripts/checks/test-fast.sh -- -race

  # Keeps the required status check named "race detector" while the work runs in shards.
  race:
    name: race detector
    needs: race-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.race-shard.result }}
        run: test "$RESULT" = success

  # The tagged JEV evidence acceptance checks. They are build-tagged out of the ordinary
  # suite (so `go test ./...` stays green before an evidence artifact exists); this job runs
  # them explicitly, so a missing or tampered evidence artifact fails CI. Deterministic; no
  # live inference.
  acceptance-evidence:
    name: tagged JEV evidence acceptance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: evidence acceptance checks
        run: |
          go test -tags='jev207_acceptance jev208_acceptance jev213_acceptance' -count=1 -v \
            -run 'TestJEVDogfoodEvidence|TestJEVBenchmarkEvidence|TestAdapterDogfoodEvidence' \
            ./internal/jev/ ./internal/decision/commandprofile/

  # The RUN-ACCEPT-001 operator acceptance checks. They sit behind the `acceptance`
  # build tag, so the ordinary suite never runs them and they can drift unnoticed
  # (six did, until the fixtures were re-baselined). They need no network, model
  # provider, or database. The `ragacceptance` and `promptfoo_live` tags are left
  # out on purpose: they require a live PostgreSQL/pgvector backend or live access.
  operator-acceptance:
    name: tagged operator acceptance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: operator acceptance checks
        run: |
          go test -tags acceptance -count=1 -run TestOperatorAcceptance \
            ./internal/cli/ ./internal/planner/ ./internal/planflow/ ./internal/archtest/

  # The distribution layer: the packaged Claude Code plugin must be current, and the
  # installer must work from a clean checkout with no agent configuration to touch. The
  # install itself is exercised for real (against a temporary HOME) by the Go tests in
  # internal/dist; the smoke steps here only exercise the documented entry points.
  distribution:
    name: installer + plugin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: plugin package is current
        run: scripts/packaging/build-claude-plugin.sh --check
      - name: installer smoke (isolated HOME, nothing written)
        env:
          HOME: ${{ runner.temp }}/sop-ci-home
        run: |
          mkdir -p "$HOME"
          ./install.sh --help
          ./install.sh --dry-run
          ./install.sh --skills zed --dry-run
          ./install.sh --skills claude --dry-run
          ./install.sh --plugin claude --dry-run
      - name: installer and plugin tests
        run: go test -v ./internal/dist/... ./internal/skill/...

  # Windows: the CLI must build there, and install.ps1 must work on the PowerShell a clean
  # machine already has. The full test suite stays on Linux — several lifecycle tests
  # execute POSIX commands (true/false/sh) — so this job covers the build, static
  # analysis, and the distribution surface, including the Windows installer tests
  # (internal/dist/install_windows_test.go) under both Windows PowerShell and pwsh.
  windows:
    name: windows (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: adapter connector + process-tree tests (Windows)
        run: go test -count=1 -v ./internal/decision/commandprofile/
      # Windows B1 is runtime behaviour, not a build property: this host has no
      # sandbox backend, so run_command must refuse every override and never
      # execute the command. The selected tests are self-contained; the full suite
      # stays on Linux because several lifecycle tests need POSIX commands.
      - name: run_command isolation refuses on Windows (B1)
        run: go test -count=1 -v -run 'TestIsolationDecision|TestIsolationPolicyNotice|TestRunCommandIsolationDefaultsToFailClosed|TestRunCommandIsolationIsOnByDefault|TestRunCommandIsolationOnWindowsRefuses' ./internal/toolharness/
      - name: install.ps1 parses (PowerShell language parser)
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
      - name: installer and plugin tests
        shell: pwsh
        run: |
          # Run the distribution tests and, on failure, publish the failing tests and the
          # first diagnostics as an annotation, so a red Windows run is diagnosable from
          # the run summary rather than only inside the step log.
          $lines = @(& go test -v ./internal/dist/... ./internal/skill/... 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $lines | Write-Host
          if ($code -ne 0) {
            # Go prints a failing test's diagnostics before its "--- FAIL" summary line,
            # followed by whatever the test printed. Collect from the nearest preceding
            # diagnostic, so the reason leads the message and survives any truncation.
            $failed = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -like '*--- FAIL: *') {
                $start = $i
                for ($j = $i - 1; $j -ge [Math]::Max(0, $i - 200); $j--) {
                  if ($lines[$j] -match '_test\.go:\d+:') { $start = $j; break }
                }
                $failed += ($lines[$start..$i] | ForEach-Object { $_.Trim() })
                $failed += ''
              }
            }
            if ($failed.Count -eq 0) { $failed = @('no "--- FAIL:" line in the output') }
            $message = ($failed -join ' || ')
            if ($message.Length -gt 60000) { $message = $message.Substring(0, 60000) }
            Write-Host "::error title=Windows distribution tests failed::$message"
            exit 1
          }
      - name: installer smoke (Windows PowerShell, isolated USERPROFILE)
        shell: powershell
        run: |
          .\install.ps1 -Help
          .\install.ps1 -DryRun

          $home_dir = Join-Path $env:RUNNER_TEMP 'sop-ci-home'
          New-Item -ItemType Directory -Force -Path $home_dir | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP 'SOP Test Home\bin'

          .\install.ps1 -BinDir $bin
          & (Join-Path $bin 'sop.exe') version

          # The agent integrations go into a scratch home, never the runner's own profile.
          $env:USERPROFILE = $home_dir
          .\install.ps1 -Skills claude -Plugin claude
          $skills = Get-ChildItem (Join-Path $home_dir '.claude\skills') -Directory
          # Expect exactly the canonical skills/ tree that install.ps1 installs from, so
          # adding or removing a skill never requires editing this smoke test.
          $expected = Get-ChildItem (Join-Path $PWD 'skills') -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'SKILL.md') } |
            Select-Object -ExpandProperty Name | Sort-Object
          $installed = $skills.Name | Sort-Object
          if (($installed -join ',') -ne ($expected -join ',')) {
            throw "installed skills mismatch: expected [$($expected -join ', ')], got [$($installed -join ', ')]"
          }
          foreach ($skill in $skills) {
            if (-not (Test-Path (Join-Path $skill.FullName '.sop-managed'))) { throw "no ownership marker in $($skill.Name)" }
          }
          Write-Host "installed: $($skills.Name -join ', ')"
      - name: installer smoke (PowerShell 7)
        shell: pwsh
        run: |
          .\install.ps1 -Help
          .\install.ps1 -DryRun
