name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, static analysis, the full test suite, and the documentation link check.
  check:
    name: fmt, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: documentation links
        run: bash scripts/check-doc-links.sh

  # The suite under the race detector, which the lifecycle and scheduler tests rely on.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test -race
        run: go test -race ./...

  # The distribution layer: the packaged Claude Code plugin must be current, and the
  # installer must work from a clean checkout with no agent configuration to touch. The
  # install itself is exercised for real (against a temporary HOME) by the Go tests in
  # internal/dist; the smoke steps here only exercise the documented entry points.
  distribution:
    name: installer + plugin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: plugin package is current
        run: scripts/build-claude-plugin.sh --check
      - name: installer smoke (isolated HOME, nothing written)
        env:
          HOME: ${{ runner.temp }}/sop-ci-home
        run: |
          mkdir -p "$HOME"
          ./install.sh --help
          ./install.sh --dry-run
          ./install.sh --skills zed --dry-run
          ./install.sh --skills claude --dry-run
          ./install.sh --plugin claude --dry-run
      - name: installer and plugin tests
        run: go test -v ./internal/dist/... ./internal/skill/...

  # Windows: the CLI must build there, and install.ps1 must work on the PowerShell a clean
  # machine already has. The full test suite stays on Linux — several lifecycle tests
  # execute POSIX commands (true/false/sh) — so this job covers the build, static
  # analysis, and the distribution surface, including the Windows installer tests
  # (internal/dist/install_windows_test.go) under both Windows PowerShell and pwsh.
  windows:
    name: windows (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: install.ps1 parses (PowerShell language parser)
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
      - name: installer and plugin tests
        shell: pwsh
        run: |
          # Run the distribution tests and, on failure, publish the failing tests and the
          # first diagnostics as an annotation, so a red Windows run is diagnosable from
          # the run summary rather than only inside the step log.
          $lines = @(& go test -v ./internal/dist/... ./internal/skill/... 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $lines | Write-Host
          if ($code -ne 0) {
            # The failing test plus the lines that follow it, which carry the installer's
            # own output.
            $failed = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -like '*--- FAIL: *') {
                $failed += $lines[$i].Trim()
                $failed += ($lines[($i + 1)..([Math]::Min($i + 15, $lines.Count - 1))] | ForEach-Object { $_.Trim() })
              }
            }
            if ($failed.Count -eq 0) { $failed = @('no "--- FAIL:" line in the output') }
            $message = ($failed -join ' || ')
            if ($message.Length -gt 60000) { $message = $message.Substring(0, 60000) }
            Write-Host "::error title=Windows distribution tests failed::$message"
            exit 1
          }
      - name: installer smoke (Windows PowerShell, isolated USERPROFILE)
        shell: powershell
        run: |
          .\install.ps1 -Help
          .\install.ps1 -DryRun

          $home_dir = Join-Path $env:RUNNER_TEMP 'sop-ci-home'
          New-Item -ItemType Directory -Force -Path $home_dir | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP 'SOP Test Home\bin'

          .\install.ps1 -BinDir $bin
          & (Join-Path $bin 'sop.exe') version

          # The agent integrations go into a scratch home, never the runner's own profile.
          $env:USERPROFILE = $home_dir
          .\install.ps1 -Skills claude -Plugin claude
          $skills = Get-ChildItem (Join-Path $home_dir '.claude\skills') -Directory
          if ($skills.Count -ne 7) { throw "expected 7 installed skills, got $($skills.Count)" }
          foreach ($skill in $skills) {
            if (-not (Test-Path (Join-Path $skill.FullName '.sop-managed'))) { throw "no ownership marker in $($skill.Name)" }
          }
          Write-Host "installed: $($skills.Name -join ', ')"
      - name: installer smoke (PowerShell 7)
        shell: pwsh
        run: |
          .\install.ps1 -Help
          .\install.ps1 -DryRun
